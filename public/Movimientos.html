<style>
  :root{
    --bg: #1C1E1F;
    --panel: #26292B;
    --panel-2: #2F3234;
    --line: #3A3D3F;
    --text: #EDECE7;
    --text-dim: #9A9D9E;
    --amber: #E8871E;
    --amber-dim: #7A4A17;
    --steel: #4C8DAE;
    --danger: #C24B3F;
    --ok: #5FA36A;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  .app{ max-width: 520px; margin: 0 auto; padding: 0 0 40px; min-height:100vh; }
  header{
    padding: 22px 20px 16px;
    border-bottom: 1px dashed var(--line);
    position: sticky; top:0; background: var(--bg); z-index: 10;
  }
  .eyebrow{
    font-family:'IBM Plex Mono', monospace;
    font-size: 11px; letter-spacing: 0.14em; color: var(--amber);
    text-transform: uppercase; margin-bottom: 6px;
  }
  h1{
    font-family:'Oswald', sans-serif; font-weight: 700; font-size: 24px;
    margin: 0; text-transform: uppercase;
  }
  h2{
    font-family:'Oswald', sans-serif; font-weight: 600; font-size: 15px;
    margin: 0 0 12px; text-transform: uppercase; letter-spacing: 0.03em; color: var(--text);
  }
  main{ padding: 20px; }
  section{ margin-bottom: 34px; }
  section:last-child{ margin-bottom: 0; }

  .huerta-badge{
    display:inline-block; font-family:'IBM Plex Mono', monospace; font-size: 11px;
    color: var(--steel); background: rgba(76,141,174,0.12); border: 1px solid rgba(76,141,174,0.3);
    padding: 4px 9px; border-radius: 4px; letter-spacing: 0.03em; margin-top: 4px;
  }

  .req{ color: var(--amber); }
  .login-overlay{
    position:fixed; inset:0; z-index:100;
    background: var(--bg);
    display:flex; align-items:center; justify-content:center;
    padding: 24px;
  }
  .login-overlay[hidden]{ display:none; }
  .login-card{
    width:100%; max-width: 360px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 26px 22px;
  }
  .login-card h2{
    font-family:'Oswald', sans-serif;
    font-size: 20px;
    margin: 0 0 20px;
    color: var(--text);
    text-transform: none;
  }
  .login-card .field label{
    display:block; font-family:'IBM Plex Mono', monospace; font-size: 11px;
    letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-dim); margin-bottom: 8px;
  }
  .login-card .field select, .login-card .field input{
    width:100%; background: var(--panel-2); border: 1px solid var(--line); color: var(--text);
    padding: 13px 12px; border-radius: 4px; font-size: 15px; outline:none;
  }
  .login-card .field select:focus, .login-card .field input:focus{ border-color: var(--amber); }
  .login-status{
    margin-top: 12px;
    font-family:'IBM Plex Mono', monospace;
    font-size: 12.5px;
    padding: 10px 12px;
    border-radius: 4px;
    display:none;
  }
  .login-status.show{ display:block; background: rgba(194,75,63,0.12); color: var(--danger); border:1px solid rgba(194,75,63,0.3); }
  .change-user-link{
    display:inline-block;
    font-family:'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.04em;
    color: var(--steel);
    text-decoration: underline;
    cursor: pointer;
  }

  .field{ margin-bottom: 14px; }
  .field label{
    display:block; font-family:'IBM Plex Mono', monospace; font-size: 10.5px;
    letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-dim); margin-bottom: 6px;
  }
  .field input, .field select, .field textarea{
    width:100%; background: var(--panel-2); border: 1px solid var(--line); color: var(--text);
    padding: 12px; border-radius: 4px; font-size: 14px; outline:none;
    font-family:'Inter',sans-serif;
  }
  .field textarea{ min-height: 64px; resize: vertical; }
  .field input:focus, .field select:focus, .field textarea:focus{ border-color: var(--amber); }
  select option{ background: var(--panel); color: var(--text); }

  .unit-select{ position: relative; }
  .unit-select.selected input{ border-color: var(--amber); color: var(--amber); font-weight: 600; }
  .unit-dropdown{
    display:none;
    position:absolute;
    top: calc(100% + 4px);
    left:0; right:0;
    max-height: 260px;
    overflow-y:auto;
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 4px;
    z-index: 20;
    box-shadow: 0 8px 24px rgba(0,0,0,0.4);
  }
  .unit-dropdown.open{ display:block; }
  .unit-option{
    padding: 11px 12px;
    font-size: 14px;
    cursor:pointer;
    border-bottom: 1px solid var(--line);
  }
  .unit-option:last-child{ border-bottom:none; }
  .unit-option:active, .unit-option.hover{ background: var(--panel); }
  .unit-empty{ padding: 14px 12px; color: var(--text-dim); font-size: 13px; }

  .save-btn{
    width:100%; padding: 13px 0; background: var(--amber); color: #1C1E1F; border:none;
    border-radius: 4px; font-family:'Oswald', sans-serif; font-weight: 700; font-size: 14px;
    text-transform: uppercase; letter-spacing:0.03em; cursor:pointer;
  }
  .save-btn:disabled{ opacity:0.5; }
  .save-status{
    font-size: 12.5px; margin-top: 10px; display:none; font-family:'IBM Plex Mono', monospace;
  }
  .save-status.show{ display:block; }
  .save-status.ok{ color: var(--ok); }
  .save-status.err{ color: var(--danger); }

  .mov-card{
    background: var(--panel); border: 1px solid var(--line); border-radius: 6px;
    padding: 14px; margin-bottom: 12px;
  }
  .mov-top{ display:flex; justify-content:space-between; align-items:center; margin-bottom: 8px; }
  .folio{ font-family:'IBM Plex Mono', monospace; font-size: 13px; color: var(--text); font-weight:600; }
  .mov-meta{ font-size: 12.5px; color: var(--text-dim); line-height:1.5; margin-bottom: 4px; }
  .mov-unit{ font-size: 14.5px; font-weight:600; margin-bottom: 6px; }
  .status-pill{
    font-family:'IBM Plex Mono', monospace; font-size: 10.5px; letter-spacing:0.04em;
    text-transform: uppercase; padding: 3px 8px; border-radius: 3px; font-weight:600;
    background: var(--panel-2); color: var(--text-dim); white-space:nowrap;
  }
  .status-pill.confirmado{ background: rgba(95,163,106,0.15); color: var(--ok); }
  .status-pill.pendiente{ background: rgba(232,135,30,0.15); color: var(--amber); }
  .mov-comentario{ font-size: 13px; color: var(--text-dim); margin-bottom: 10px; line-height:1.4; }
  .confirm-btn{
    width:100%; padding: 10px 0; background: var(--steel); color: #14181A; border:none;
    border-radius: 4px; font-family:'Oswald', sans-serif; font-weight: 700; font-size: 13px;
    text-transform: uppercase; letter-spacing:0.03em; cursor:pointer; margin-top: 4px;
  }
  .confirm-btn:disabled{ opacity:0.5; }

  .media-actions{ display:flex; gap: 10px; }
  .media-btn{
    flex:1; display:flex; flex-direction:column; align-items:center; gap:6px;
    padding: 14px 8px; border: 1.5px dashed var(--line); border-radius: 6px;
    background: var(--panel); cursor:pointer; color: var(--text-dim); font-size: 12px;
    text-align:center; transition: border-color .15s ease, color .15s ease;
  }
  .media-btn:active{ border-color: var(--amber); color: var(--amber); }
  .media-btn .icon{ font-size: 22px; }
  .photo-box{
    border: 1.5px dashed var(--line); border-radius: 6px; padding: 16px;
    text-align:center; cursor:pointer; background: var(--panel); position:relative; overflow:hidden;
  }
  .photo-box.has-photo{ padding: 0; border-style: solid; }
  .photo-box img{ width:100%; display:block; max-height:240px; object-fit:cover; }
  .photo-remove{
    position:absolute; top:8px; right:8px; background: rgba(28,30,31,0.85); color: var(--text);
    border:1px solid var(--line); border-radius: 4px; padding: 6px 10px; font-size: 12px;
    font-family:'IBM Plex Mono',monospace; cursor:pointer;
  }

  .empty{ text-align:center; padding: 30px 20px; color: var(--text-dim); font-size: 13.5px; }
  .loading{
    text-align:center; padding: 30px; color: var(--text-dim);
    font-family:'IBM Plex Mono', monospace; font-size: 13px;
  }
</style>
</head>
<body>
<div class="login-overlay" id="login-overlay" hidden>
  <div class="login-card">
    <div class="eyebrow">Flota &amp; Mantenimiento</div>
    <h2>Iniciar sesión</h2>
    <div class="field">
      <label>Usuario <span class="req">*</span></label>
      <select id="login-nombre">
        <option value="" disabled selected>Selecciona tu nombre</option>
      </select>
    </div>
    <div class="field">
      <label>Contraseña <span class="req">*</span></label>
      <input type="password" id="login-pass" placeholder="Tu contraseña" autocomplete="off">
    </div>
    <button class="save-btn" id="login-btn" style="width:100%;">Entrar</button>
    <div class="login-status" id="login-status"></div>
  </div>
</div>

<div class="app">
  <div id="view-main" style="display:none;">
    <header style="display:flex; justify-content:space-between; align-items:flex-end;">
      <div>
        <div class="eyebrow">Flota &amp; Mantenimiento</div>
        <h1>Movimientos</h1>
        <div class="huerta-badge" id="huerta-badge"></div>
      </div>
      <div style="display:flex; flex-direction:column; align-items:flex-end; gap:6px;">
        <button id="btn-refresh" style="background:transparent;border:1px solid var(--line);color:var(--text-dim);padding:8px 12px;border-radius:4px;font-family:'IBM Plex Mono',monospace;font-size:11px;cursor:pointer;white-space:nowrap;">Actualizar</button>
        <span class="change-user-link" id="btn-change-user">Cambiar usuario</span>
      </div>
    </header>
    <main>
      <section>
        <h2>Llegadas pendientes en tu huerta</h2>
        <div id="pendientes-list"><div class="loading">Cargando...</div></div>
      </section>

      <section>
        <h2>Registrar salida de un equipo</h2>
        <div class="field">
          <label>Número de unidad <span class="req">*</span></label>
          <div class="unit-select" id="unit-select">
            <input type="text" id="f-unidad-search" placeholder="Escribe para buscar la unidad..." autocomplete="off">
            <div class="unit-dropdown" id="unit-dropdown"></div>
          </div>
        </div>
        <div class="field">
          <label>Huerta destino <span class="req">*</span></label>
          <select id="f-huerta-destino">
            <option value="" disabled selected>Selecciona la huerta destino</option>
          </select>
        </div>
        <div class="field">
          <label>Foto del equipo (opcional)</label>
          <div class="media-actions" id="media-actions-salida">
            <div class="media-btn" id="btn-take-photo-salida">
              <span class="icon">📷</span>
              <span>Tomar foto</span>
            </div>
            <div class="media-btn" id="btn-gallery-salida">
              <span class="icon">🖼️</span>
              <span>Galería</span>
            </div>
          </div>
          <div class="photo-box" id="photo-box-salida" style="display:none;"></div>
          <input type="file" id="f-photo-camera-salida" accept="image/*" capture="environment" style="display:none;">
          <input type="file" id="f-gallery-salida" accept="image/*" style="display:none;">
        </div>
        <div class="field">
          <label>Comentario (opcional)</label>
          <textarea id="f-comentario" placeholder="Motivo del traslado, observaciones..."></textarea>
        </div>
        <button class="save-btn" id="btn-submit-salida">Registrar salida</button>
        <div class="save-status" id="salida-status"></div>
      </section>

      <section>
        <h2>Mis salidas recientes</h2>
        <div id="salidas-list"><div class="loading">Cargando...</div></div>
      </section>
    </main>
  </div>
</div>

<script>
// ============================================================
// Shim de compatibilidad: reemplaza google.script.run por llamadas
// fetch() al servidor local (Node.js), igual que en Index.html / Taller.html.
(function () {
  const API_BASE = '/api';

  function crearRunner(successCb, failCb) {
    return new Proxy(
      {},
      {
        get(target, prop) {
          if (prop === 'withSuccessHandler') {
            return (cb) => crearRunner(cb, failCb);
          }
          if (prop === 'withFailureHandler') {
            return (cb) => crearRunner(successCb, cb);
          }
          return function (...args) {
            fetch(`${API_BASE}/${prop}`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ args }),
            })
              .then(async (res) => {
                const data = await res.json().catch(() => null);
                if (!res.ok) {
                  const err = new Error((data && data.error) || ('Error HTTP ' + res.status));
                  throw err;
                }
                return data;
              })
              .then((data) => {
                if (successCb) successCb(data);
              })
              .catch((err) => {
                if (failCb) failCb(err);
                else console.error(err);
              });
          };
        },
      }
    );
  }

  window.google = window.google || {};
  window.google.script = window.google.script || {};
  window.google.script.run = crearRunner(null, null);
})();
// ============================================================

// TALLER se agrega al final (no es una huerta de cultivo, pero sí un destino

let UNIDADES = UNIDADES_TODAS;
let nombreUsuario = '';

let ubicacionesUnidades = {};
let unidadSeleccionada = null; // { v, l }

function recomputarUnidadesFiltradas(){
  const h = (huertaUsuario || '').trim().toUpperCase();
  if(!h){
    UNIDADES = UNIDADES_TODAS;
  } else {
    UNIDADES = UNIDADES_TODAS.filter(function(u){
      const asignada = ubicacionesUnidades[u.v];
      return !asignada || asignada.trim().toUpperCase() === h;
    });
  }
}

function cargarUbicacionesUnidades(){
  google.script.run
    .withSuccessHandler(function(filas){
      ubicacionesUnidades = {};
      (filas || []).forEach(function(r){ ubicacionesUnidades[r.CodigoUnidad] = r.Huerta; });
      recomputarUnidadesFiltradas();
    })
    .withFailureHandler(function(){ /* si falla, no se filtra: se muestran todas las unidades */ })
    .getUbicacionesUnidades();
}

function poblarHuertaDestino(){
  var sel = document.getElementById('f-huerta-destino');
  var propia = (huertaUsuario || '').trim().toUpperCase();
  sel.innerHTML = '<option value="" disabled selected>Selecciona la huerta destino</option>';
  HUERTAS.forEach(function(h){
    if(h.trim().toUpperCase() === propia) return;
    var opt = document.createElement('option');
    opt.value = h; opt.textContent = h;
    sel.appendChild(opt);
  });
}

function formatFecha(iso){
  if(!iso) return '';
  var d = new Date(iso);
  if(isNaN(d.getTime())) return iso;
  return d.toLocaleString('es-MX', { day:'2-digit', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit' });
}
function escapeHtml(s){
  var d = document.createElement('div');
  d.textContent = s == null ? '' : s;
  return d.innerHTML;
}

// --- Foto opcional (tanto al registrar la salida como al confirmar la
// llegada). Mismo mecanismo de compresión (redimensiona a 900px de ancho y
// comprime a JPEG) que usa la foto del formulario de Reportar en Index.html. ---
function comprimirFotoMov(file, cb){
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    const img = new Image();
    img.onload = () => {
      const maxW = 900;
      const scale = Math.min(1, maxW / img.width);
      const canvas = document.createElement('canvas');
      canvas.width = img.width * scale;
      canvas.height = img.height * scale;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      cb(canvas.toDataURL('image/jpeg', 0.6));
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
}

function renderFotoMovThumb(url, label){
  if(!url || url.indexOf('VID:') === 0) return '';
  return '<div style="margin-top:8px;"><a href="' + url + '" target="_blank" rel="noopener">' +
    '<img src="' + url + '" alt="' + escapeHtml(label) + '" style="max-width:140px;max-height:140px;border-radius:4px;display:block;border:1px solid var(--line);"></a></div>';
}

galleryInputSalida.onchange = (e) => {
  comprimirFotoMov(e.target.files[0], (url) => { fotoSalidaDataUrl = url; renderPhotoPreviewSalida(); });
};

    loginStatus.classList.add('show');

  }
  btn.disabled = true;

  google.script.run
    .withSuccessHandler(function(res){

      btn.textContent = 'Entrar';
      if(res && res.success){
        iniciarApp(nombre, res.huerta);
      } else {
        loginStatus.textContent = (res && res.error) || 'No se pudo iniciar sesión.';
        loginStatus.classList.add('show');
      }
    })
    .withFailureHandler(function(){
      btn.disabled = false;
      btn.textContent = 'Entrar';
      loginStatus.textContent = 'Error de conexión. Intenta de nuevo.';
      loginStatus.classList.add('show');
    })
    .validarUsuario(nombre, pass, 'Movimientos');
}

function asegurarUsuario(){
  var nombre = localStorage.getItem('mov_nombre');
  if(!nombre){
    mostrarLogin();
    return;
  }
  google.script.run
    .withSuccessHandler(function(huerta){ iniciarApp(nombre, huerta); })
    .withFailureHandler(function(){ mostrarLogin(); })
    .getHuertaPorUsuario(nombre);
}

document.getElementById('login-btn').addEventListener('click', intentarLogin);
document.getElementById('login-pass').addEventListener('keydown', function(e){
  if(e.key === 'Enter'){ intentarLogin(); }
});
document.getElementById('btn-change-user').addEventListener('click', function(){
  localStorage.removeItem('mov_nombre');
  mostrarLogin();
});
document.getElementById('btn-refresh').addEventListener('click', function(){
  cargarUbicacionesUnidades();
  cargarMovimientos();
});

window.addEventListener('load', asegurarUsuario);

// --- Selector de unidad (buscador con desplegable) ---
const unitSelectWrap = document.getElementById('unit-select');
const unitSearchInput = document.getElementById('f-unidad-search');
const unitDropdown = document.getElementById('unit-dropdown');

function renderUnitOptions(filterText){
  const q = (filterText || '').trim().toUpperCase();
  const matches = q === '' ? UNIDADES.slice(0, 40) : UNIDADES.filter(u => u.l.toUpperCase().includes(q)).slice(0, 40);
  if(matches.length === 0){
    unitDropdown.innerHTML = '<div class="unit-empty">Sin resultados</div>';
    return;
  }
  unitDropdown.innerHTML = matches.map(u =>
    `<div class="unit-option" data-v="${u.v}" data-l="${escapeHtml(u.l)}">${escapeHtml(u.l)}</div>`
  ).join('');
  unitDropdown.querySelectorAll('.unit-option').forEach(opt => {
    opt.onclick = () => {
      unidadSeleccionada = { v: opt.dataset.v, l: opt.dataset.l };
      unitSearchInput.value = opt.dataset.l;
      unitSelectWrap.classList.add('selected');
      unitDropdown.classList.remove('open');
    };
  });
}
unitSearchInput.addEventListener('focus', () => {
  unitDropdown.classList.add('open');
  renderUnitOptions(unitSearchInput.value);
});
unitSearchInput.addEventListener('input', () => {
  unidadSeleccionada = null;
  unitSelectWrap.classList.remove('selected');
  unitDropdown.classList.add('open');
  renderUnitOptions(unitSearchInput.value);
});
document.addEventListener('click', (e) => {
  if(!unitSelectWrap.contains(e.target)){
    unitDropdown.classList.remove('open');
  }
});

// --- Registrar salida ---
document.getElementById('btn-submit-salida').addEventListener('click', function(){
  var status = document.getElementById('salida-status');
  var btn = document.getElementById('btn-submit-salida');
  var huertaDestino = document.getElementById('f-huerta-destino').value;
  var comentario = document.getElementById('f-comentario').value.trim();
  status.classList.remove('show', 'ok', 'err');

  if(!unidadSeleccionada){
    status.textContent = 'Selecciona una unidad de la lista.';
    status.classList.add('show', 'err');
    return;
  }
  if(!huertaDestino){
    status.textContent = 'Selecciona la huerta destino.';
    status.classList.add('show', 'err');
    return;
  }
  btn.disabled = true;
  btn.textContent = 'Registrando...';
  google.script.run
    .withSuccessHandler(function(res){
      btn.disabled = false;
      btn.textContent = 'Registrar salida';
      if(res && res.success){
        status.textContent = 'Salida registrada: ' + res.folio + '. Cuando llegue a su destino, el encargado de esa huerta debe confirmar la llegada.';
        status.classList.add('show', 'ok');
        unidadSeleccionada = null;
        unitSearchInput.value = '';
        unitSelectWrap.classList.remove('selected');
        document.getElementById('f-huerta-destino').value = '';
        document.getElementById('f-comentario').value = '';
        fotoSalidaDataUrl = null;
        photoBoxSalida.classList.remove('has-photo');
        photoBoxSalida.style.display = 'none';
        photoBoxSalida.innerHTML = '';
        mediaActionsSalida.style.display = 'flex';
        cameraPhotoInputSalida.value = '';
        galleryInputSalida.value = '';
        cargarMovimientos();
      } else {
        status.textContent = (res && res.error) || 'No se pudo registrar la salida.';
        status.classList.add('show', 'err');
      }
    })
    .withFailureHandler(function(){
      btn.disabled = false;
      btn.textContent = 'Registrar salida';
      status.textContent = 'Error de conexión. Intenta de nuevo.';
      status.classList.add('show', 'err');
    })
    .submitMovimientoSalida({
      nombre: nombreUsuario,
      unidad: unidadSeleccionada.v,
      unidadLabel: unidadSeleccionada.l,
      huertaDestino: huertaDestino,
      comentario: comentario || null,
      foto: fotoSalidaDataUrl,
    });
});

// --- Llegadas pendientes y mis salidas recientes ---
function cargarMovimientos(){
  google.script.run
    .withSuccessHandler(function(res){
      res = res || {};
      if(res.huerta && res.huerta !== huertaUsuario){
        huertaUsuario = res.huerta;
        document.getElementById('huerta-badge').textContent = huertaUsuario ? ('Tu huerta: ' + huertaUsuario) : 'Sin huerta asignada';
        poblarHuertaDestino();
        recomputarUnidadesFiltradas();
      }
      renderPendientes(res.pendientesLlegada || []);
      renderSalidas(res.misSalidas || []);
    })
    .withFailureHandler(function(){
      document.getElementById('pendientes-list').innerHTML = '<div class="empty">No se pudieron cargar los movimientos.</div>';
      document.getElementById('salidas-list').innerHTML = '<div class="empty">No se pudieron cargar los movimientos.</div>';
    })
    .getMovimientosDeUsuario(nombreUsuario);
}

function renderPendientes(lista){
  var cont = document.getElementById('pendientes-list');
  if(!lista.length){
    cont.innerHTML = '<div class="empty">No hay llegadas pendientes de confirmar en tu huerta.</div>';
    return;
  }
  cont.innerHTML = lista.map(function(m){
    return '<div class="mov-card" data-folio="' + escapeHtml(m.Folio) + '">' +
      '<div class="mov-top"><span class="folio">' + escapeHtml(m.Folio) + '</span><span class="status-pill pendiente">Pendiente</span></div>' +
      '<div class="mov-unit">' + escapeHtml(m.Unidad) + '</div>' +
      '<div class="mov-meta">Desde: ' + escapeHtml(m.HuertaOrigen) + ' &middot; Reportó: ' + escapeHtml(m.UsuarioSalida) + '<br>Salió: ' + escapeHtml(formatFecha(m.FechaSalida)) + '</div>' +
      (m.ComentarioSalida ? '<div class="mov-comentario">"' + escapeHtml(m.ComentarioSalida) + '"</div>' : '') +
      renderFotoMovThumb(m.FotoSalidaURL, 'Foto de salida') +
      '<textarea class="comentario-llegada" placeholder="Comentario de llegada (opcional)"></textarea>' +
      '<div class="mov-foto-llegada-wrap" style="margin-bottom:8px;">' +
        '<div class="media-btn mov-foto-btn" style="display:inline-flex;width:auto;padding:8px 12px;">' +
          '<span class="icon" style="font-size:16px;">📷</span><span style="font-size:12px;">Agregar foto de llegada (opcional)</span>' +
        '</div>' +
        '<input type="file" accept="image/*" capture="environment" class="mov-foto-llegada-input" style="display:none;">' +
        '<div class="mov-foto-llegada-preview"></div>' +
      '</div>' +
      '<button class="confirm-btn">Confirmar llegada</button>' +
      '</div>';
  }).join('');
  cont.querySelectorAll('.mov-card').forEach(function(card){
    var folio = card.dataset.folio;
    var fotoBtn = card.querySelector('.mov-foto-btn');
    var fotoInput = card.querySelector('.mov-foto-llegada-input');
    var fotoPreview = card.querySelector('.mov-foto-llegada-preview');
    fotoBtn.addEventListener('click', function(){ fotoInput.click(); });
    fotoInput.addEventListener('change', function(e){
      comprimirFotoMov(e.target.files[0], function(url){
        fotosLlegadaMov[folio] = url;
        fotoPreview.innerHTML = '<img src="' + url + '" alt="Foto de llegada" style="max-width:100px;max-height:100px;border-radius:4px;margin-top:6px;display:block;border:1px solid var(--line);">';
      });
    });

    var btn = card.querySelector('.confirm-btn');
    btn.addEventListener('click', function(){
      var comentario = card.querySelector('.comentario-llegada').value.trim();
      btn.disabled = true;
      btn.textContent = 'Confirmando...';
      google.script.run
        .withSuccessHandler(function(res){
          if(res && res.success){
            delete fotosLlegadaMov[folio];
            cargarMovimientos();
            cargarUbicacionesUnidades();
          } else {
            btn.disabled = false;
            btn.textContent = 'Confirmar llegada';
            alert((res && res.error) || 'No se pudo confirmar la llegada.');
          }
        })
        .withFailureHandler(function(){
          btn.disabled = false;
          btn.textContent = 'Confirmar llegada';
          alert('Error de conexión. Intenta de nuevo.');
        })
        .confirmarLlegadaMovimiento(folio, nombreUsuario, comentario || null, fotosLlegadaMov[folio] || null);
    });
  });
}

function renderSalidas(lista){
  var cont = document.getElementById('salidas-list');
  if(!lista.length){
    cont.innerHTML = '<div class="empty">Todavía no has registrado salidas.</div>';
    return;
  }
  cont.innerHTML = lista.map(function(m){
    var esConfirmado = (m.Estado || '').toLowerCase() === 'confirmado';
    return '<div class="mov-card">' +
      '<div class="mov-top"><span class="folio">' + escapeHtml(m.Folio) + '</span><span class="status-pill ' + (esConfirmado ? 'confirmado' : 'pendiente') + '">' + (esConfirmado ? 'Confirmado' : 'Pendiente') + '</span></div>' +
      '<div class="mov-unit">' + escapeHtml(m.Unidad) + '</div>' +
      '<div class="mov-meta">Hacia: ' + escapeHtml(m.HuertaDestino) + ' &middot; Salió: ' + escapeHtml(formatFecha(m.FechaSalida)) +
      (esConfirmado ? ('<br>Recibió: ' + escapeHtml(m.UsuarioLlegada) + ' &middot; Llegó: ' + escapeHtml(formatFecha(m.FechaLlegada))) : '') +
      '</div>' +
      renderFotoMovThumb(m.FotoSalidaURL, 'Foto de salida') +
      renderFotoMovThumb(m.FotoLlegadaURL, 'Foto de llegada') +
      '</div>';
  }).join('');
}
</script>
