<style>
  :root{
    --bg: #1C1E1F;
    --panel: #26292B;
    --panel-2: #2F3234;
    --line: #3A3D3F;
    --text: #EDECE7;
    --text-dim: #9A9D9E;
    --amber: #E8871E;
    --amber-dim: #7A4A17;
    --steel: #4C8DAE;
    --danger: #C24B3F;
    --ok: #5FA36A;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  .app{ max-width: 520px; margin: 0 auto; padding: 0 0 40px; min-height:100vh; }
  header{
    padding: 22px 20px 16px;
    border-bottom: 1px dashed var(--line);
    position: sticky; top:0; background: var(--bg); z-index: 10;
  }
  .eyebrow{
    font-family:'IBM Plex Mono', monospace;
    font-size: 11px; letter-spacing: 0.14em; color: var(--amber);
    text-transform: uppercase; margin-bottom: 6px;
  }
  h1{
    font-family:'Oswald', sans-serif; font-weight: 700; font-size: 24px;
    margin: 0; text-transform: uppercase;
  }
  main{ padding: 20px; }

  .gate{
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    min-height: 70vh; text-align:center; padding: 20px;
  }
  .gate p{ color: var(--text-dim); font-size:14px; margin: 8px 0 24px; }
  .gate input{
    width:100%; max-width:280px; background: var(--panel); border: 1px solid var(--line);
    color: var(--text); padding: 14px 12px; border-radius: 4px; font-size: 16px;
    text-align:center; letter-spacing: 0.08em; outline:none; margin-bottom: 14px;
  }
  .gate input:focus{ border-color: var(--amber); }
  .gate button{
    width:100%; max-width:280px; padding: 14px 0; background: var(--amber); color: #1C1E1F;
    border:none; border-radius: 4px; font-family:'Oswald', sans-serif; font-weight: 700;
    font-size: 15px; text-transform: uppercase; letter-spacing:0.03em; cursor:pointer;
  }
  .gate .err{ color: var(--danger); font-size: 13px; margin-top: 12px; display:none; }
  .gate .err.show{ display:block; }

  .req{ color: var(--amber); }
  .login-overlay{
    position:fixed; inset:0; z-index:100;
    background: var(--bg);
    display:flex; align-items:center; justify-content:center;
    padding: 24px;
  }
  .login-overlay[hidden]{ display:none; }
  .login-card{
    width:100%; max-width: 360px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 26px 22px;
  }
  .login-card h2{
    font-family:'Oswald', sans-serif;
    font-size: 20px;
    margin: 0 0 20px;
    color: var(--text);
  }
  .login-card .field label{
    display:block; font-family:'IBM Plex Mono', monospace; font-size: 11px;
    letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-dim); margin-bottom: 8px;
  }
  .login-card .field select, .login-card .field input{
    width:100%; background: var(--panel-2); border: 1px solid var(--line); color: var(--text);

  .video-link-orig{

  .media-actions{ display:flex; gap: 8px; margin-bottom: 8px; }

  }
  .evidence-remove{
    position:absolute; top:6px; right:6px; background: rgba(28,30,31,0.85);

    font-size: 12px; color: var(--text-dim); margin-bottom: 10px;

  .existing-evidence a{ color: var(--amber); }

  .save-btn{

  /* Refacciones necesarias por orden: qué piezas hacen falta, capturadas

  .rn-acciones{ display:flex; gap:8px; flex-wrap:wrap; margin:8px 0; }

    text-align:center; padding: 40px; color: var(--text-dim);
    font-family:'IBM Plex Mono', monospace; font-size: 13px;
  }
</style>

<body>
<div class="login-overlay" id="login-overlay" hidden>
  <div class="login-card">
    <div class="eyebrow">Flota &amp; Mantenimiento</div>
    <h2>Iniciar sesión</h2>
    <div class="field">
      <label>Usuario <span class="req">*</span></label>
      <select id="login-nombre">
        <option value="" disabled selected>Selecciona tu nombre</option>
      </select>
    </div>
    <div class="field">
      <label>Contraseña <span class="req">*</span></label>
      <input type="password" id="login-pass" placeholder="Tu contraseña" autocomplete="off">
    </div>
    <button class="save-btn" id="login-btn" style="width:100%;">Entrar</button>
    <div class="login-status" id="login-status"></div>
  </div>
</div>

<div class="app">

  <div id="view-main" style="display:none;">
    <header style="display:flex; justify-content:space-between; align-items:flex-end;">
      <div>
        <div class="eyebrow">Flota &amp; Mantenimiento</div>
        <h1>Taller</h1>
      </div>
      <div style="display:flex; flex-direction:column; align-items:flex-end; gap:6px;">
        <button id="btn-refresh" style="background:transparent;border:1px solid var(--line);color:var(--text-dim);padding:8px 12px;border-radius:4px;font-family:'IBM Plex Mono',monospace;font-size:11px;cursor:pointer;white-space:nowrap;">Actualizar</button>
        <span class="change-user-link" id="btn-change-user">Cambiar usuario</span>
      </div>
    </header>
    <main>
      <div class="filters">
        <input type="text" id="f-search" placeholder="Buscar por orden, unidad o huerta...">
      </div>
      <div class="filter-summary" id="filter-summary"></div>
      <div id="order-list"><div class="loading">Cargando órdenes...</div></div>
    </main>
  </div>

</div>


<script>
// ============================================================
// Shim de compatibilidad: reemplaza google.script.run por llamadas
// fetch() al servidor local (Node.js), SIN tocar el resto del código
// de este archivo. El resto del archivo sigue usando exactamente el
// mismo patrón:
//   google.script.run.withSuccessHandler(cb).withFailureHandler(cb).nombreFuncion(args)
// y aquí simplemente lo traducimos a: POST /api/nombreFuncion  { args: [...] }
(function () {
  const API_BASE = '/api';

  function crearRunner(successCb, failCb) {
    return new Proxy(
      {},
      {
        get(target, prop) {
          if (prop === 'withSuccessHandler') {
            return (cb) => crearRunner(cb, failCb);
          }
          if (prop === 'withFailureHandler') {
            return (cb) => crearRunner(successCb, cb);
          }
          // Cualquier otro nombre de propiedad se trata como el nombre de la
          // función a invocar en el servidor (igual que google.script.run).
          return function (...args) {
            fetch(`${API_BASE}/${prop}`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ args }),
            })
              .then(async (res) => {
                const data = await res.json().catch(() => null);
                if (!res.ok) {
                  const err = new Error((data && data.error) || ('Error HTTP ' + res.status));
                  throw err;
                }
                return data;
              })
              .then((data) => {
                if (successCb) successCb(data);
              })
              .catch((err) => {
                if (failCb) failCb(err);
                else console.error(err);
              });
          };
        },
      }
    );
  }

  window.google = window.google || {};
  window.google.script = window.google.script || {};
  window.google.script.run = crearRunner(null, null);
})();
// ============================================================


const ACCESS_CODE = 'Operacion';
let ALL_RECORDS = [];
const EVIDENCIA_DATA = {};
const MAX_VIDEO_MB = 8;

// --- Identidad del usuario: login con nombre (desplegable) + contraseña ---
function mostrarLogin(){
  document.getElementById('view-main').style.display = 'none';
  document.getElementById('login-overlay').hidden = false;
  document.getElementById('login-pass').value = '';
  var loginStatus = document.getElementById('login-status');
  loginStatus.classList.remove('show');
  google.script.run
    .withSuccessHandler(function(nombres){
      var sel = document.getElementById('login-nombre');
      sel.innerHTML = '<option value="" disabled selected>Selecciona tu nombre</option>';
      (nombres || []).forEach(function(n){
        var opt = document.createElement('option');
        opt.value = n; opt.textContent = n;
        sel.appendChild(opt);
      });
    })
    .withFailureHandler(function(){})
    .getNombresUsuarios('Taller');
}

function iniciarApp(nombre){
  localStorage.setItem('taller_nombre', nombre);
  document.getElementById('login-overlay').hidden = true;
  document.getElementById('view-main').style.display = 'block';
  cargarOrdenes();
}

function intentarLogin(){
  var nombre = document.getElementById('login-nombre').value;
  var pass = document.getElementById('login-pass').value;
  var loginStatus = document.getElementById('login-status');
  var btn = document.getElementById('login-btn');
  if(!nombre || !pass){
    loginStatus.textContent = 'Selecciona tu nombre y escribe tu contraseña.';
    loginStatus.classList.add('show');
    return;
  }
  btn.disabled = true;
  btn.textContent = 'Entrando...';
  google.script.run
    .withSuccessHandler(function(res){
      btn.disabled = false;
      btn.textContent = 'Entrar';
      if(res && res.success){
        iniciarApp(nombre);
      } else {
        loginStatus.textContent = (res && res.error) || 'No se pudo iniciar sesión.';
        loginStatus.classList.add('show');
      }
    })
    .withFailureHandler(function(){
      btn.disabled = false;
      btn.textContent = 'Entrar';
      loginStatus.textContent = 'Error de conexión. Intenta de nuevo.';
      loginStatus.classList.add('show');
    })
    .validarUsuario(nombre, pass, 'Taller');
}

function cargarOrdenes(){
  var nombre = localStorage.getItem('taller_nombre') || '';
  google.script.run
    .withSuccessHandler(function(records){
      ALL_RECORDS = records || [];
      renderList();
    })
    .withFailureHandler(function(){
      document.getElementById('order-list').innerHTML = '<div class="empty">No se pudieron cargar las órdenes.</div>';
    })
    .getReportesTaller(ACCESS_CODE, nombre);
}

document.getElementById('login-btn').addEventListener('click', intentarLogin);
document.getElementById('login-pass').addEventListener('keydown', function(e){
  if(e.key === 'Enter'){ intentarLogin(); }
});
document.getElementById('btn-change-user').addEventListener('click', function(){
  localStorage.removeItem('taller_nombre');
  mostrarLogin();
});

window.addEventListener('load', function(){
  var nombre = localStorage.getItem('taller_nombre');
  if(nombre){
    iniciarApp(nombre);
  } else {
    mostrarLogin();
  }
});

function estadoDe(r){
  if(r.FechaSalida) return { label: 'Completado', cls: 'done' };
  if(r.FechaAtencion) return { label: 'En proceso', cls: 'progress' };
  if(r.EnProcesoSinFecha) return { label: 'En proceso', cls: 'progress' };
  return { label: 'Pendiente', cls: '' };
}

function getFiltered(){
  var q = document.getElementById('f-search').value.trim().toUpperCase();
  return ALL_RECORDS.filter(function(r){
    if(estadoDe(r).label !== 'En proceso') return false;
    if(q){
      var haystack = [r.Orden, r.Unidad, r.CodigoUnidad, r.Huerta].join(' ').toUpperCase();
      if(haystack.indexOf(q) === -1) return false;
    }
    return true;
  });
}

function escapeHtml(s){
  var d = document.createElement('div');
  d.textContent = (s === null || s === undefined) ? '' : s;
  return d.innerHTML;
}

function dateInputValue(v){
  if(!v) return '';
  var d = new Date(v);
  if(isNaN(d.getTime())) return '';
  return d.toISOString().slice(0,10);
}

function buildMediaOriginalNode(r){
  if(!r.FotoURL) return null;
  var isVideo = r.FotoURL.indexOf('VID:') === 0;
  if(isVideo){
    var url = r.FotoURL.slice(4).replace('/preview','/view');
    var a = document.createElement('a');
    a.href = url;
    a.target = '_blank';
    a.rel = 'noopener';
    a.className = 'video-link-orig';
    var play = document.createElement('span');
    play.className = 'video-play-orig';
    play.textContent = '>';
    var label = document.createElement('span');
    label.textContent = 'Ver video del reporte';
    a.appendChild(play);
    a.appendChild(label);
    return a;
  }
  var img = document.createElement('img');
  img.className = 'media-orig';
  img.src = r.FotoURL;
  img.alt = 'Foto del reporte';
  return img;
}

function buildEvidenciaExistenteNode(r){
  if(!r.EvidenciaURL) return null;
  var isVideo = r.EvidenciaURL.indexOf('VID:') === 0;
  var url = isVideo ? r.EvidenciaURL.slice(4).replace('/preview','/view') : r.EvidenciaURL;
  var div = document.createElement('div');
  div.className = 'existing-evidence';
  div.appendChild(document.createTextNode('Evidencia actual: '));
  var a = document.createElement('a');
  a.href = url;
  a.target = '_blank';
  a.rel = 'noopener';
  a.textContent = isVideo ? 'Ver video' : 'Ver foto';
  div.appendChild(a);
  div.appendChild(document.createTextNode(' (subir una nueva la reemplaza)'));
  return div;
}

function buildOrderCard(r){
  var estado = estadoDe(r);
  var orden = r.Orden;

  var card = document.createElement('div');
  card.className = 'order-card';
  card.dataset.orden = orden;

  var top = document.createElement('div');
  top.className = 'order-top';
  var topLeft = document.createElement('div');
  var folio = document.createElement('div');
  folio.className = 'folio';
  folio.textContent = orden + ' - ' + (r.Unidad || r.CodigoUnidad);
  var meta = document.createElement('div');
  meta.className = 'order-meta';
  meta.textContent = (r.Huerta || '') + ' - ' + new Date(r.Fecha).toLocaleDateString('es-MX');
  topLeft.appendChild(folio);
  topLeft.appendChild(meta);
  var pill = document.createElement('span');
  pill.className = 'status-pill ' + estado.cls;
  pill.textContent = estado.label;
  top.appendChild(topLeft);
  top.appendChild(pill);
  top.addEventListener('click', function(){ toggleOrder(orden); });

  var body = document.createElement('div');
  body.className = 'order-body';
  body.id = 'body-' + orden;

  var mediaNode = buildMediaOriginalNode(r);
  if(mediaNode) body.appendChild(mediaNode);

  var desc = document.createElement('div');
  desc.className = 'order-desc';
  desc.textContent = r.Descripcion;
  body.appendChild(desc);

  // Fecha de atencion (solo lectura)
  var fAtencionField = document.createElement('div');
  fAtencionField.className = 'field';
  var lblAtencion = document.createElement('label');
  lblAtencion.innerHTML = 'Fecha de atencion <span style="font-weight:400;text-transform:none;">(asignada por oficina)</span>';
  var roAtencion = document.createElement('div');
  roAtencion.className = 'readonly-field';
  roAtencion.textContent = r.FechaAtencion ? new Date(r.FechaAtencion).toLocaleDateString('es-MX') : 'Sin asignar todavia';
  fAtencionField.appendChild(lblAtencion);
  fAtencionField.appendChild(roAtencion);
  body.appendChild(fAtencionField);

  // Fecha de salida
  var fSalidaField = document.createElement('div');
  fSalidaField.className = 'field';
  var lblSalida = document.createElement('label');
  lblSalida.textContent = 'Fecha de salida';
  var inputSalida = document.createElement('input');
  inputSalida.type = 'date';
  inputSalida.id = 'fs-' + orden;
  inputSalida.value = dateInputValue(r.FechaSalida);
  fSalidaField.appendChild(lblSalida);
  fSalidaField.appendChild(inputSalida);
  body.appendChild(fSalidaField);

  // Horometro/kilometraje con el que se hizo el servicio — solo para
  // ordenes generadas desde una regla de Mantenimiento preventivo por
  // horas o kilometros (ver ReglaMantenimientoId/TipoPeriodicidadRegla,
  // que vienen de mantenimiento_ordenes/mantenimiento_reglas). Esta es
  // la lectura que actualiza el "ultimo registro" de la regla al cerrar
  // la orden, para que el proximo servicio se recalcule bien aunque
  // haya pasado tiempo desde que se generó la orden.
  if(r.ReglaMantenimientoId && (r.TipoPeriodicidadRegla === 'horas' || r.TipoPeriodicidadRegla === 'kilometros')){
    var esKm = r.TipoPeriodicidadRegla === 'kilometros';
    var lecturaField = document.createElement('div');
    lecturaField.className = 'field';
    var lblLectura = document.createElement('label');
    lblLectura.textContent = (esKm ? 'Kilometraje' : 'Horometro') + ' con el que se hizo el servicio';
    var inputLectura = document.createElement('input');
    inputLectura.type = 'number';
    inputLectura.step = '0.01';
    inputLectura.min = '0';
    inputLectura.id = 'lc-' + orden;
    inputLectura.placeholder = esKm ? 'Ej. 45230' : 'Ej. 7080.5';
    if(r.LecturaCierre !== null && r.LecturaCierre !== undefined){ inputLectura.value = r.LecturaCierre; }
    lecturaField.appendChild(lblLectura);
    lecturaField.appendChild(inputLectura);
    if(r.LecturaGeneracion !== null && r.LecturaGeneracion !== undefined){
      var hintLectura = document.createElement('div');
      hintLectura.style.cssText = 'font-size:11px;color:var(--text-dim);margin-top:4px;';
      hintLectura.textContent = 'Cuando se generó esta orden, el equipo marcaba ' + r.LecturaGeneracion + (esKm ? ' km' : ' h') + '. Si el servicio se hizo despues, captura aqui la lectura real de hoy.';
      lecturaField.appendChild(hintLectura);
    }
    body.appendChild(lecturaField);
  }

  // Refacciones necesarias: que piezas hacen falta para esta orden (texto,
  // dictado o foto, interpretados por IA contra el catalogo de Refacciones).
  body.appendChild(buildRefaccionesNecesariasNode(r));

  // Descripcion de lo realizado
  var trabajoField = document.createElement('div');
  trabajoField.className = 'field';
  var lblTrabajo = document.createElement('label');
  lblTrabajo.textContent = 'Descripcion de lo realizado (opcional)';
  var textTrabajo = document.createElement('textarea');
  textTrabajo.id = 'tr-' + orden;
  textTrabajo.placeholder = 'Que se hizo para atender la falla...';
  textTrabajo.value = r.TrabajoRealizado || '';
  trabajoField.appendChild(lblTrabajo);
  trabajoField.appendChild(textTrabajo);

  body.appendChild(trabajoField);

  // Evidencia de cierre
  var evField = document.createElement('div');
  evField.className = 'field';
  var lblEv = document.createElement('label');
  lblEv.textContent = 'Evidencia de cierre (opcional)';
  evField.appendChild(lblEv);
  var existente = buildEvidenciaExistenteNode(r);
  if(existente) evField.appendChild(existente);

  var mediaActions = document.createElement('div');
  mediaActions.className = 'media-actions';
  mediaActions.id = 'media-actions-' + orden;

  var camFoto = document.createElement('input');
  camFoto.type = 'file'; camFoto.accept = 'image/*'; camFoto.capture = 'environment';
  camFoto.style.display = 'none'; camFoto.id = 'cam-foto-' + orden;

  var camVideo = document.createElement('input');
  camVideo.type = 'file'; camVideo.accept = 'video/*'; camVideo.capture = 'environment';
  camVideo.style.display = 'none'; camVideo.id = 'cam-video-' + orden;

  var galInput = document.createElement('input');
  galInput.type = 'file'; galInput.accept = 'image/*,video/*';
  galInput.style.display = 'none'; galInput.id = 'gal-' + orden;

  [camFoto, camVideo, galInput].forEach(function(inp){
    inp.addEventListener('change', function(){ handleEvidencia(orden, inp.files[0]); });
  });

  var btnFoto = document.createElement('div');
  btnFoto.className = 'media-btn';
  btnFoto.innerHTML = '<span class="icon">Foto</span><span>Foto</span>';
  btnFoto.addEventListener('click', function(){ camFoto.click(); });

  var btnVideo = document.createElement('div');
  btnVideo.className = 'media-btn';
  btnVideo.innerHTML = '<span class="icon">Video</span><span>Video</span>';
  btnVideo.addEventListener('click', function(){ camVideo.click(); });

  var btnGal = document.createElement('div');
  btnGal.className = 'media-btn';
  btnGal.innerHTML = '<span class="icon">Galeria</span><span>Galeria</span>';
  btnGal.addEventListener('click', function(){ galInput.click(); });

  mediaActions.appendChild(btnFoto);
  mediaActions.appendChild(btnVideo);
  mediaActions.appendChild(btnGal);
  evField.appendChild(mediaActions);

  var evPreview = document.createElement('div');
  evPreview.id = 'evidence-preview-' + orden;
  evField.appendChild(evPreview);

  evField.appendChild(camFoto);
  evField.appendChild(camVideo);
  evField.appendChild(galInput);

  body.appendChild(evField);

  var saveBtn = document.createElement('button');
  saveBtn.className = 'save-btn';
  saveBtn.textContent = 'Guardar cambios';
  saveBtn.addEventListener('click', function(){ guardarOrden(orden); });
  body.appendChild(saveBtn);

  var statusMsg = document.createElement('div');
  statusMsg.className = 'save-status';
  statusMsg.id = 'ss-' + orden;
  body.appendChild(statusMsg);

  card.appendChild(top);
  card.appendChild(body);
  return card;
}

// --- Refacciones necesarias por orden -----------------------------------
// Que piezas hacen falta para atender esta orden: por texto, por dictado
// (reconocimiento de voz del navegador, sin subir ningun audio) o por foto
// -- en estos dos ultimos casos se manda al servidor, que le pide a la IA
// que separe lo detectado y lo compare contra el catalogo de Refacciones
// ya dado de alta. Nada se guarda solo: se revisa la lista de trabajo y se
// confirma con "Guardar refacciones". Si una pieza no esta en el catalogo
// se guarda como texto libre pendiente de catalogar -- desde el Taller no
// se puede dar de alta en el catalogo (eso lo hace el Panel), asi que solo
// se muestra la marca "Pendiente de catalogar".
var REFNEC_TALLER = {}; // orden -> { cargado: bool, items: [...] }
var REFNEC_TALLER_RECOGNITION = null;
var REFNEC_TALLER_DICTANDO_ORDEN = null;

function buildRefaccionesNecesariasNode(r){
  var orden = r.Orden;
  var wrap = document.createElement('div');
  wrap.className = 'field';

  var lbl = document.createElement('label');
  lbl.textContent = 'Refacciones necesarias';
  wrap.appendChild(lbl);

  var textarea = document.createElement('textarea');
  textarea.id = 'rn-texto-' + orden;
  textarea.placeholder = 'Ej. necesito un filtro de aceite y una banda de ventilador';
  textarea.rows = 2;
  wrap.appendChild(textarea);

  var acciones = document.createElement('div');
  acciones.className = 'rn-acciones';

  var btnDictar = document.createElement('button');
  btnDictar.type = 'button';
  btnDictar.className = 'rn-accion-btn';
  btnDictar.id = 'rn-dictar-' + orden;
  btnDictar.textContent = 'Dictar';
  btnDictar.addEventListener('click', function(){ rnDictar(orden); });

  var btnFoto = document.createElement('button');
  btnFoto.type = 'button';
  btnFoto.className = 'rn-accion-btn';
  btnFoto.textContent = 'Foto';
  var fotoInput = document.createElement('input');
  fotoInput.type = 'file';
  fotoInput.accept = 'image/*';
  fotoInput.capture = 'environment';
  fotoInput.style.display = 'none';
  fotoInput.id = 'rn-foto-input-' + orden;
  fotoInput.addEventListener('change', function(){ rnFotoElegida(orden, fotoInput.files[0]); });
  btnFoto.addEventListener('click', function(){ fotoInput.click(); });

  var btnInterpretar = document.createElement('button');
  btnInterpretar.type = 'button';
  btnInterpretar.className = 'rn-accion-btn';
  btnInterpretar.id = 'rn-interpretar-' + orden;
  btnInterpretar.textContent = 'Interpretar con IA';
  btnInterpretar.addEventListener('click', function(){ rnInterpretarTexto(orden); });

  var btnManual = document.createElement('button');
  btnManual.type = 'button';
  btnManual.className = 'rn-accion-btn';
  btnManual.textContent = 'Agregar tal cual';
  btnManual.addEventListener('click', function(){ rnAgregarManual(orden); });

  acciones.appendChild(btnDictar);
  acciones.appendChild(btnFoto);
  acciones.appendChild(btnInterpretar);
  acciones.appendChild(btnManual);
  wrap.appendChild(acciones);
  wrap.appendChild(fotoInput);

  var rnStatus = document.createElement('div');
  rnStatus.className = 'rn-status';
  rnStatus.id = 'rn-interp-status-' + orden;
  wrap.appendChild(rnStatus);

  var lista = document.createElement('div');
  lista.className = 'rn-lista';
  lista.id = 'rn-lista-' + orden;
  lista.innerHTML = '<div class="rn-vacio">Cargando...</div>';
  wrap.appendChild(lista);

  var btnGuardar = document.createElement('button');
  btnGuardar.type = 'button';
  btnGuardar.className = 'rn-guardar-btn';
  btnGuardar.id = 'rn-guardar-' + orden;
  btnGuardar.textContent = 'Guardar refacciones';
  btnGuardar.addEventListener('click', function(){ rnGuardar(orden); });
  wrap.appendChild(btnGuardar);

  var guardarStatus = document.createElement('div');
  guardarStatus.className = 'rn-status';
  guardarStatus.id = 'rn-guardar-status-' + orden;
  wrap.appendChild(guardarStatus);

  // getFiltered()/renderList() reconstruyen toda la lista de tarjetas en
  // cada tecleo del buscador; si ya se habia cargado esta orden no hace
  // falta volver a pedirla al servidor, solo repintar lo que ya se tiene.
  // Ojo: en este punto "wrap"/"lista" todavia NO estan pegados al
  // documento (el caller los agrega despues), asi que para el repintado
  // inicial se le pasa el nodo "lista" directo en vez de buscarlo por
  // getElementById (que no lo encontraria todavia).
  if(REFNEC_TALLER[orden] && REFNEC_TALLER[orden].cargado){
    rnRenderLista(orden, lista);
  } else {
    rnCargar(orden);
  }

  return wrap;
}

function rnCargar(orden){
  var nombre = localStorage.getItem('taller_nombre') || '';
  google.script.run
    .withSuccessHandler(function(result){
      if(!result){ result = { items: [], sugeridas: [] }; }
      var items = (result.items && result.items.length > 0) ? result.items : (result.sugeridas || []);
      REFNEC_TALLER[orden] = { cargado: true, items: items.map(function(it){
        return { texto: it.texto, cantidad: it.cantidad, refaccionId: it.refaccionId, origen: it.origen };
      }) };
      rnRenderLista(orden);
    })
    .withFailureHandler(function(){
      var lista = document.getElementById('rn-lista-' + orden);
      if(lista) lista.innerHTML = '<div class="rn-vacio">No se pudo cargar.</div>';
    })
    .getRefaccionesNecesarias(ACCESS_CODE, nombre, orden);
}

function rnRenderLista(orden, listaEl){
  var lista = listaEl || document.getElementById('rn-lista-' + orden);
  if(!lista) return;
  var items = (REFNEC_TALLER[orden] && REFNEC_TALLER[orden].items) || [];
  if(items.length === 0){
    lista.innerHTML = '<div class="rn-vacio">Todavia no hay piezas agregadas.</div>';
    return;
  }
  lista.innerHTML = '';
  items.forEach(function(it, idx){
    var vinculada = !!it.refaccionId;
    var row = document.createElement('div');
    row.className = 'rn-item ' + (vinculada ? 'rn-vinculada' : 'rn-pendiente');

    var texto = document.createElement('span');
    texto.className = 'rn-item-texto';
    texto.textContent = it.texto;
    row.appendChild(texto);

    var cantidadWrap = document.createElement('span');
    cantidadWrap.className = 'rn-item-cantidad';
    cantidadWrap.appendChild(document.createTextNode('×'));
    var cantidadInput = document.createElement('input');
    cantidadInput.type = 'number';
    cantidadInput.className = 'rn-item-cantidad-input';
    cantidadInput.min = '0.01';
    cantidadInput.step = '0.01';
    cantidadInput.value = it.cantidad || 1;
    cantidadInput.addEventListener('click', function(e){ e.stopPropagation(); });
    cantidadInput.addEventListener('input', function(){
      var n = Number(cantidadInput.value);
      REFNEC_TALLER[orden].items[idx].cantidad = (cantidadInput.value !== '' && !isNaN(n) && n > 0) ? n : null;
    });
    cantidadWrap.appendChild(cantidadInput);
    row.appendChild(cantidadWrap);

    var badge = document.createElement('span');
    badge.className = 'rn-item-badge';
    badge.textContent = vinculada ? 'En catalogo' : 'Pendiente de catalogar';
    row.appendChild(badge);

    var quitar = document.createElement('button');
    quitar.type = 'button';
    quitar.className = 'rn-item-quitar';
    quitar.textContent = 'Quitar';
    quitar.addEventListener('click', function(){
      REFNEC_TALLER[orden].items.splice(idx, 1);
      rnRenderLista(orden);
    });
    row.appendChild(quitar);

    lista.appendChild(row);
  });
}

function rnAgregarManual(orden){
  var campo = document.getElementById('rn-texto-' + orden);
  var texto = campo.value.trim();
  if(!texto) return;
  if(!REFNEC_TALLER[orden]) REFNEC_TALLER[orden] = { cargado: true, items: [] };
  texto.split(/[\n,]+/).map(function(s){ return s.trim(); }).filter(Boolean).forEach(function(p){
    REFNEC_TALLER[orden].items.push({ texto: p, cantidad: 1, refaccionId: null, origen: 'manual' });
  });
  campo.value = '';
  rnRenderLista(orden);
}

function rnInterpretarTexto(orden){
  var nombre = localStorage.getItem('taller_nombre') || '';
  var campo = document.getElementById('rn-texto-' + orden);
  var texto = campo.value.trim();
  var statusEl = document.getElementById('rn-interp-status-' + orden);
  var btn = document.getElementById('rn-interpretar-' + orden);
  if(!texto){
    statusEl.textContent = 'Escribe o dicta algo primero.';
    statusEl.className = 'rn-status show err';
    return;
  }
  btn.disabled = true;
  btn.textContent = 'Interpretando...';
  statusEl.textContent = '';
  statusEl.className = 'rn-status';

  google.script.run
    .withSuccessHandler(function(result){
      btn.disabled = false;
      btn.textContent = 'Interpretar con IA';
      if(!result || !result.success){
        statusEl.textContent = (result && result.error) || 'No se pudo interpretar.';
        statusEl.className = 'rn-status show err';
        return;
      }
      if(!REFNEC_TALLER[orden]) REFNEC_TALLER[orden] = { cargado: true, items: [] };
      result.items.forEach(function(it){
        REFNEC_TALLER[orden].items.push({ texto: it.texto, cantidad: it.cantidad, refaccionId: it.refaccionId, origen: 'texto' });
      });
      campo.value = '';
      rnRenderLista(orden);
    })
    .withFailureHandler(function(err){
      btn.disabled = false;
      btn.textContent = 'Interpretar con IA';
      statusEl.textContent = (err && err.message) || 'No se pudo interpretar. Intenta de nuevo.';
      statusEl.className = 'rn-status show err';
    })
    .interpretarRefaccionesTexto(ACCESS_CODE, nombre, orden, texto);
}

function rnFotoElegida(orden, file){
  if(!file) return;
  var reader = new FileReader();
  reader.onload = function(ev){
    var img = new Image();
    img.onload = function(){
      var maxW = 1200;
      var scale = Math.min(1, maxW / img.width);
      var canvas = document.createElement('canvas');
      canvas.width = img.width * scale;
      canvas.height = img.height * scale;
      var ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      rnInterpretarFoto(orden, canvas.toDataURL('image/jpeg', 0.8));
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
}

function rnInterpretarFoto(orden, dataUrl){
  var nombre = localStorage.getItem('taller_nombre') || '';
  var statusEl = document.getElementById('rn-interp-status-' + orden);
  statusEl.textContent = 'Leyendo foto... (puede tardar unos segundos)';
  statusEl.className = 'rn-status show';

  google.script.run
    .withSuccessHandler(function(result){
      if(!result || !result.success){
        statusEl.textContent = (result && result.error) || 'No se pudo leer la foto.';
        statusEl.className = 'rn-status show err';
        return;
      }
      if(!REFNEC_TALLER[orden]) REFNEC_TALLER[orden] = { cargado: true, items: [] };
      result.items.forEach(function(it){
        REFNEC_TALLER[orden].items.push({ texto: it.texto, cantidad: it.cantidad, refaccionId: it.refaccionId, origen: 'foto' });
      });
      statusEl.textContent = '';
      statusEl.className = 'rn-status';
      rnRenderLista(orden);
    })
    .withFailureHandler(function(err){
      statusEl.textContent = (err && err.message) || 'No se pudo leer la foto. Intenta de nuevo.';
      statusEl.className = 'rn-status show err';
    })
    .interpretarRefaccionesFoto(ACCESS_CODE, nombre, orden, dataUrl);
}

// Dictado por voz (reconocimiento de voz del navegador -- no graba ni sube
// ningun archivo de audio, solo convierte lo hablado a texto ahi mismo).
function rnDictar(orden){
  var SpeechRecognitionCtor = window.SpeechRecognition || window.webkitSpeechRecognition;
  var btn = document.getElementById('rn-dictar-' + orden);
  var statusEl = document.getElementById('rn-interp-status-' + orden);
  if(!SpeechRecognitionCtor){
    statusEl.textContent = 'El dictado por voz no esta disponible en este navegador.';
    statusEl.className = 'rn-status show err';
    return;
  }
  if(REFNEC_TALLER_DICTANDO_ORDEN === orden){
    REFNEC_TALLER_RECOGNITION.stop();
    return;
  }
  REFNEC_TALLER_RECOGNITION = new SpeechRecognitionCtor();
  REFNEC_TALLER_RECOGNITION.lang = 'es-MX';
  REFNEC_TALLER_RECOGNITION.interimResults = false;
  REFNEC_TALLER_RECOGNITION.maxAlternatives = 1;
  REFNEC_TALLER_RECOGNITION.onstart = function(){
    REFNEC_TALLER_DICTANDO_ORDEN = orden;
    btn.classList.add('rn-dictando');
    btn.textContent = 'Escuchando...';
  };
  REFNEC_TALLER_RECOGNITION.onresult = function(e){
    var textoFinal = '';
    for(var i = 0; i < e.results.length; i++){ textoFinal += e.results[i][0].transcript; }
    var campo = document.getElementById('rn-texto-' + orden);
    campo.value = (campo.value ? campo.value.trim() + ' ' : '') + textoFinal.trim();
  };
  REFNEC_TALLER_RECOGNITION.onerror = function(e){
    statusEl.textContent = 'No se pudo escuchar (' + (e.error || 'error') + ').';
    statusEl.className = 'rn-status show err';
  };
  REFNEC_TALLER_RECOGNITION.onend = function(){
    REFNEC_TALLER_DICTANDO_ORDEN = null;
    btn.classList.remove('rn-dictando');
    btn.textContent = 'Dictar';
  };
  statusEl.textContent = '';
  statusEl.className = 'rn-status';
  REFNEC_TALLER_RECOGNITION.start();
}

function rnGuardar(orden){
  var nombre = localStorage.getItem('taller_nombre') || '';
  var btn = document.getElementById('rn-guardar-' + orden);
  var statusEl = document.getElementById('rn-guardar-status-' + orden);
  var items = ((REFNEC_TALLER[orden] && REFNEC_TALLER[orden].items) || []).map(function(it){
    return { refaccionId: it.refaccionId || null, texto: it.texto, cantidad: it.cantidad || 1, origen: it.origen || 'manual' };
  });

  btn.disabled = true;
  btn.textContent = 'Guardando...';
  statusEl.textContent = '';
  statusEl.className = 'rn-status';

  google.script.run
    .withSuccessHandler(function(result){
      btn.disabled = false;
      btn.textContent = 'Guardar refacciones';
      if(!result || !result.success){
        statusEl.textContent = (result && result.error) || 'No se pudo guardar.';
        statusEl.className = 'rn-status show err';

      statusEl.className = 'rn-status show err';

}

function handleEvidencia(orden, file){
  if(!file) return;
  if(file.type.indexOf('video/') === 0){
    if(file.size > MAX_VIDEO_MB * 1024 * 1024){
      alert('El video pesa mas de ' + MAX_VIDEO_MB + 'MB. Graba un clip mas corto.');
      return;
    }
    var reader = new FileReader();
    reader.onload = function(ev){
      EVIDENCIA_DATA[orden] = { dataUrl: ev.target.result, tipo: 'video' };
      renderEvidenciaPreview(orden);
    };
    reader.readAsDataURL(file);
    return;
  }
  var reader2 = new FileReader();
  reader2.onload = function(ev){
    var img = new Image();
    img.onload = function(){
      var maxW = 900;
      var scale = Math.min(1, maxW / img.width);
      var canvas = document.createElement('canvas');
      canvas.width = img.width * scale;
      canvas.height = img.height * scale;
      var ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      EVIDENCIA_DATA[orden] = { dataUrl: canvas.toDataURL('image/jpeg', 0.6), tipo: 'image' };
      renderEvidenciaPreview(orden);
    };
    img.src = ev.target.result;
  };
  reader2.readAsDataURL(file);
}

function renderEvidenciaPreview(orden){
  var wrap = document.getElementById('evidence-preview-' + orden);
  var acciones = document.getElementById('media-actions-' + orden);
  var info = EVIDENCIA_DATA[orden];
  wrap.innerHTML = '';
  if(!info){ acciones.style.display = 'flex'; return; }
  acciones.style.display = 'none';

  var previewWrap = document.createElement('div');
  previewWrap.className = 'evidence-preview';

  var mediaEl;
  if(info.tipo === 'video'){
    mediaEl = document.createElement('video');
    mediaEl.src = info.dataUrl;
    mediaEl.controls = true;
    mediaEl.muted = true;
    mediaEl.playsInline = true;
  } else {
    mediaEl = document.createElement('img');
    mediaEl.src = info.dataUrl;
    mediaEl.alt = 'Evidencia';
  }
  previewWrap.appendChild(mediaEl);

  var removeBtn = document.createElement('div');
  removeBtn.className = 'evidence-remove';
  removeBtn.textContent = 'Quitar';
  removeBtn.addEventListener('click', function(){ quitarEvidencia(orden); });
  previewWrap.appendChild(removeBtn);

  wrap.appendChild(previewWrap);
}

function quitarEvidencia(orden){
  delete EVIDENCIA_DATA[orden];
  renderEvidenciaPreview(orden);
}

function toggleOrder(orden){
  var body = document.getElementById('body-' + orden);
  var isOpen = body.classList.contains('open');
  var openBodies = document.querySelectorAll('.order-body.open');
  for(var i=0; i<openBodies.length; i++){ openBodies[i].classList.remove('open'); }
  if(!isOpen){ body.classList.add('open'); }
}

function guardarOrden(orden){
  var fs = document.getElementById('fs-' + orden).value;
  var trabajoEl = document.getElementById('tr-' + orden);
  var trabajo = trabajoEl ? trabajoEl.value.trim() : '';
  var lecturaEl = document.getElementById('lc-' + orden);
  var lectura = lecturaEl ? lecturaEl.value.trim() : '';
  var statusEl = document.getElementById('ss-' + orden);
  var btn = document.querySelector('#body-' + orden + ' .save-btn');
  var nombre = localStorage.getItem('taller_nombre') || '';

  btn.disabled = true;
  btn.textContent = 'Guardando...';
  statusEl.classList.remove('show');

  var payload = { FechaSalida: fs, AtendioPor: nombre, TrabajoRealizado: trabajo };
  if(lecturaEl){ payload.LecturaServicio = lectura; }
  if(EVIDENCIA_DATA[orden]){ payload.evidenciaFoto = EVIDENCIA_DATA[orden].dataUrl; }

  google.script.run
    .withSuccessHandler(function(result){
      btn.disabled = false;
      btn.textContent = 'Guardar cambios';
      if(!result || !result.success){
        statusEl.textContent = 'No se pudo guardar. ' + ((result && result.error) || '');
        statusEl.className = 'save-status show err';
        return;
      }
      statusEl.textContent = 'Guardado correctamente OK';
      statusEl.className = 'save-status show ok';
      var rec = null;
      for(var i=0; i<ALL_RECORDS.length; i++){ if(ALL_RECORDS[i].Orden === orden){ rec = ALL_RECORDS[i]; break; } }
      if(rec){
        rec.FechaSalida = fs; rec.AtendioPor = nombre; rec.TrabajoRealizado = trabajo;
        if(lecturaEl){ rec.LecturaCierre = lectura === '' ? null : Number(lectura); }
        if(result.evidenciaUrl){ rec.EvidenciaURL = result.evidenciaUrl; }
      }
      delete EVIDENCIA_DATA[orden];
      var card = document.querySelector('.order-card[data-orden="' + orden + '"] .status-pill');
      if(card){
        var estado = estadoDe({FechaAtencion: rec ? rec.FechaAtencion : null, FechaSalida: fs});
        card.textContent = estado.label;
        card.className = 'status-pill ' + estado.cls;
      }
    })
    .withFailureHandler(function(err){
      console.error(err);
      btn.disabled = false;
      btn.textContent = 'Guardar cambios';
      statusEl.textContent = 'No se pudo guardar. Intenta de nuevo.';
      statusEl.className = 'save-status show err';
    })
    .actualizarOrden(ACCESS_CODE, nombre, orden, payload);
}

document.getElementById('f-search').addEventListener('input', renderList);

document.getElementById('btn-refresh').onclick = function(){
  var nombre = localStorage.getItem('taller_nombre') || '';
  var btn = document.getElementById('btn-refresh');
  btn.disabled = true;
  btn.textContent = 'Actualizando...';
  google.script.run
    .withSuccessHandler(function(records){
      ALL_RECORDS = records || [];
      btn.disabled = false;
      btn.textContent = 'Actualizar';
      renderList();
    })
    .withFailureHandler(function(){
      btn.disabled = false;
      btn.textContent = 'Actualizar';
    })
    .getReportesTaller(ACCESS_CODE, nombre);
};
</script>
</body>
